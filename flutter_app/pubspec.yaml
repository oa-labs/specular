name: specular
description: "GMS-free local-first Markdown notes synced through GitHub."
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  collection: ^1.19.1
  dio: ^5.9.0
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  flutter_markdown: ^0.7.7+1
  flutter_riverpod: ^3.4.1
  flutter_secure_storage: ^10.3.1
  go_router: ^17.1.0
  image_picker: ^1.2.1
  path: ^1.9.1
  path_provider: ^2.1.6
  record: ^6.1.2
  uuid: ^4.5.2
  workmanager: ^0.10.7

dev_dependencies:
  build_runner: ^2.8.0
  drift_dev: ^2.34.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
