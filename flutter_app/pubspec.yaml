name: specular
description: "GMS-free local-first Markdown notes synced through GitHub."
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: ^3.12.2

dependencies:
  # Pub's 6.2.0 release predates Flutter 3.44's TextInputClient API. Pin the
  # upstream compatibility fix until AppFlowy publishes a newer release.
  appflowy_editor:
    git:
      url: https://github.com/AppFlowy-IO/appflowy-editor.git
      ref: 01eccc6ee36bd07698bd80915289fe7070478cd2
  archive: ^4.0.9
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  collection: ^1.19.1
  crypto: ^3.0.7
  dio: ^5.9.0
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  flutter_markdown_plus: ^1.0.12
  flutter_riverpod: ^3.4.1
  flutter_secure_storage: ^10.3.1
  flutter_web_auth_2: ^4.1.0
  go_router: ^17.1.0
  image_picker: ^1.2.1
  path: ^1.9.1
  path_provider: ^2.1.6
  record: ^7.1.1
  url_launcher: ^6.3.2
  uuid: ^4.5.2
  workmanager: ^0.10.7

dev_dependencies:
  build_runner: ^2.8.0
  drift_dev: ^2.34.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
