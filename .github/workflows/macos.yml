name: macOS

on:
  pull_request:
  push:
    branches: [main]

jobs:
  flutter-macos:
    runs-on: macos-14
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.9
          channel: stable
          cache: true
      - run: pod --version
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build macos --debug
